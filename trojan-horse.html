<script>
/* ═══════════ 兼容垫片 ═══════════
   这份东西要能在老 WebView 里活下来。下面这几个缺口每一个都能让整页变哑，
   而且症状全都是「渲染得好好的，控件却一个都按不动」：

   1) classList.toggle(name, force) —— 旧实现直接忽略第二个参数，于是 paint 每次
      都把选中态反转一次：点一下变过去，下一次重绘又变回来，看起来就是按不动，
      甚至反着来。所以下面一律用 setCls() 走明确的两步。
   2) NodeList.prototype.forEach —— 缺失时第一处 querySelectorAll().forEach 就抛。
   3) Element.prototype.closest —— 缺失时事件委托里的 e.target.closest(...) 直接
      TypeError，整层委托连同页面上的所有按钮一起死掉。
   4) Object.assign / includes / padStart —— 缺失时初始化阶段就断。 */
(function () {
  var AP = Array.prototype, SP = String.prototype;
  if (!Object.assign) Object.assign = function (t) {
    for (var i = 1; i < arguments.length; i++) {
      var s = arguments[i]; if (!s) continue;
      for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) t[k] = s[k];
    }
    return t;
  };
  if (!AP.forEach) AP.forEach = function (f, a) { for (var i = 0; i < this.length; i++) f.call(a, this[i], i, this); };
  if (!AP.includes) AP.includes = function (v, f) { return this.indexOf(v, f || 0) !== -1; };
  if (!AP.find) AP.find = function (f, a) { for (var i = 0; i < this.length; i++) { if (f.call(a, this[i], i, this)) return this[i]; } };
  if (!SP.includes) SP.includes = function (v) { return this.indexOf(v) !== -1; };
  if (!SP.padStart) SP.padStart = function (n, c) {
    c = c || ' '; var s = String(this); while (s.length < n) s = c + s; return s;
  };
  if (typeof NodeList !== 'undefined' && !NodeList.prototype.forEach) NodeList.prototype.forEach = AP.forEach;
  if (typeof HTMLCollection !== 'undefined' && !HTMLCollection.prototype.forEach) HTMLCollection.prototype.forEach = AP.forEach;
  if (typeof DOMTokenList !== 'undefined' && !DOMTokenList.prototype.forEach) DOMTokenList.prototype.forEach = AP.forEach;
  if (typeof Element !== 'undefined') {
    if (!Element.prototype.matches) {
      var mm = Element.prototype.matchesSelector || Element.prototype.webkitMatchesSelector
        || Element.prototype.msMatchesSelector || Element.prototype.mozMatchesSelector;
      if (mm) Element.prototype.matches = function (s) { return mm.call(this, s); };
    }
    if (!Element.prototype.closest) {
      Element.prototype.closest = function (s) {
        var n = this;
        while (n && n.nodeType === 1) { if (n.matches(s)) return n; n = n.parentElement; }
        return null;
      };
    }
  }
  if (typeof window !== 'undefined' && !window.requestAnimationFrame) {
    window.requestAnimationFrame = function (f) { return setTimeout(function () { f(new Date().getTime()); }, 16); };
  }
})();
